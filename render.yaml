databases:
  - name: smart-campus-db
    databaseName: smart_campus
    plan: free
    postgresMajorVersion: "16"

services:
  # 1. Redis / Key-Value Store (OTP TTL, Rate Limiting, JWT Refresh & Blacklist)
  - type: keyvalue
    name: smart-campus-redis
    plan: free
    ipAllowList: []

  # 2. Python FastAPI ML Service
  - type: web
    name: smart-campus-ml
    runtime: python
    plan: free
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  # 3. Node.js + TypeScript Express Backend
  - type: web
    name: smart-campus-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-campus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: smart-campus-redis
          property: connectionString
      - key: FASTAPI_URL
        fromService:
          type: web
          name: smart-campus-ml
          envVarKey: RENDER_EXTERNAL_URL
      - key: FASTAPI_TIMEOUT_MS
        value: "20000"
      - key: USE_MOCK_AI
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 2h
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "Smart Campus <onboarding@resend.dev>"
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: smart-campus-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"

  # 4. React + Vite Static Frontend
  - type: web
    name: smart-campus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-campus-backend
          envVarKey: RENDER_EXTERNAL_URL
