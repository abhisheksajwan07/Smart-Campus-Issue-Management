services:
  # -------------------------------------------------------------
  # 1. POSTGRESQL DATABASE (with pgvector support pre-installed)
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart-campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_campus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_campus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campus-network

  # -------------------------------------------------------------
  # 2. REDIS (Rate Limiting, OTP Storage, Login Guard)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smart-campus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - campus-network

  # -------------------------------------------------------------
  # 3. NODE.JS + TYPESCRIPT MAIN BACKEND
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-campus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_campus
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_smart_campus_jwt_key_2026
      JWT_EXPIRES_IN: 7d
      FASTAPI_URL: http://ml-service:8000
      USE_MOCK_AI: "false" # Switch to 'false' once ml-service is ready
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
    networks:
      - campus-network

  # -------------------------------------------------------------
  # 4. PYTHON FASTAPI ML SERVICE
  # -------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smart-campus-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - campus-network

  # -------------------------------------------------------------
  # 5. FRONTEND REACT / VITE APP (Ready for Frontend Teammate)
  # -------------------------------------------------------------
  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: smart-campus-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     VITE_BACKEND_URL: http://localhost:5000/api
  #   networks:
  #     - campus-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  campus-network:
    driver: bridge

