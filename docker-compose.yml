services:
  # -------------------------------------------------------------
  # 1. POSTGRESQL DATABASE (with pgvector support pre-installed)
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smart-campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_campus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_campus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campus-network

  # -------------------------------------------------------------
  # 2. REDIS (Rate Limiting, OTP Storage, Login Guard)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smart-campus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - campus-network

  # -------------------------------------------------------------
  # 3. PYTHON FASTAPI ML SERVICE
  # -------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smart-campus-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campus-network

  # -------------------------------------------------------------
  # 4. NODE.JS + TYPESCRIPT MAIN BACKEND
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-campus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/smart_campus
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_smart_campus_jwt_key_2026
      JWT_ACCESS_SECRET: super_secret_smart_campus_jwt_key_2026
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: super_secret_smart_campus_refresh_key_2026
      JWT_REFRESH_EXPIRES_IN: 7d
      FASTAPI_URL: http://ml-service:8000
      FASTAPI_TIMEOUT_MS: 10000
      USE_MOCK_AI: "false"
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - campus-network

  # -------------------------------------------------------------
  # 5. FRONTEND REACT / VITE APP (Nginx + /api & /uploads Proxy)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-campus-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - campus-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  backend_uploads:
    driver: local

networks:
  campus-network:
    driver: bridge
